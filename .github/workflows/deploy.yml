name: Build JAR and Upload to GCS

on:
  push:
    branches:
      - main
      - feature/pipeline-setup
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build JAR and Push to GCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build JAR
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Verify JAR
        run: ls -lh target/*.jar

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload JAR to GCS
        run: |
          JAR=$(ls target/*shaded* 2>/dev/null || ls target/*.jar | grep -v original | head -1)
          echo "Uploading: $JAR"
          gsutil cp $JAR gs://axp-dataflow-bucket/jars/gcs-dataflow-etl-${{ github.sha }}.jar
          gsutil cp $JAR gs://axp-dataflow-bucket/jars/latest.jar
          echo "✅ JAR uploaded!"
          gsutil ls -lh gs://axp-dataflow-bucket/jars/

      - name: Upload Spark and config
        run: |
          gsutil cp spark/bq_to_mysql.py gs://axp-dataflow-bucket/spark/bq_to_mysql.py
          gsutil cp config/pipeline_config.json gs://axp-dataflow-bucket/config/pipeline_config.json
          echo "✅ Spark + config uploaded"
